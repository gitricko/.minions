# Self-update dependency catalog — schema v2
# SINGLE SOURCE OF TRUTH for the dependency self-update system.
# scripts/sync-versions.sh generates etc/versions.env from this file.
# scripts/check-updates.sh and scripts/bump.sh read from this file.
#
# version: current pinned version (the pin). This is the source of truth.
# source_type: github_tag | npm | release_tarball | git_tag
# sha_source: shasums | release_assets | none  (where to fetch the digest)
# sha256: per-platform digests, populated by bump.sh for tarball deps.
#         Empty strings match the current placeholder state until fetched.

dependencies:
  - name: MINIONS
    version: "1.0.0"
    source_type: git_tag
    repo: gitricko/.minions
    sha_source: none

  - name: HERMES
    version: "v2026.9.14"
    source_type: github_tag
    repo: NousResearch/hermes-agent
    selector: "v20*"
    sha_source: none

  - name: PI
    version: "0.85.1"
    source_type: npm
    package: "@earendil-works/pi-coding-agent"
    channel: latest
    sha_source: none

  - name: OMNIROUTE
    version: "3.8.50"
    source_type: npm
    package: omniroute
    channel: latest
    sha_source: none

  - name: NINEROUTER
    version: "0.5.81"
    source_type: npm
    package: 9router
    channel: latest
    sha_source: none

  - name: NODE
    version: "26.8.2"
    source_type: release_tarball
    repo: nodejs/node
    release_url: https://nodejs.org/dist/v{{VERSION}}/
    sha_source: shasums
    platforms: [linux_x64, linux_arm64, macos_x64, macos_arm64]
    sha256:
      linux_x64: "40e1d3225c1c9ae9a2671c98ecb9857e4d5555026394f348645676798840d5c5"
      linux_arm64: "81d8f0fdea9dcd3bfdcfeafc5f8359c151f097e9880b0007c0645ca670d07971"
      macos_x64: "49950999366bf6cd47c8c8fd3593aa82fb5efed494937b380b85677338285ca0"
      macos_arm64: "f58e5044b938a3174184de4aaf1d2bbfcfff812e88220ff08e9221c09f5c8677"

  - name: UV
    version: "0.12.15"
    source_type: release_tarball
    repo: astral-sh/uv
    release_url: https://github.com/astral-sh/uv/releases/download/{{VERSION}}/
    sha_source: release_assets
    platforms: [linux_x64, linux_arm64, macos_x64, macos_arm64]
    sha256:
      linux_x64: "f97935763c04be3e692460a7aaeaaab8fc3b78fcf8b389da820b38ae7423a638"
      linux_arm64: "0e9a3499b0587d449c9ff684c0160da607826e4af1cee220bc87f378702d3e08"
