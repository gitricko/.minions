      linux_arm64: "7a6353f63eb3d04765004b4adf172616243e4522434635cb1d26288658b04ab5"
      macos_x64: "fdaa8c236bd054de59059743ed8d2766de154d81853ca26ad89aca899696170a"
      macos_arm64: "f222f7e85cc1d5a3d84786aa86836ec3d41c4dcdf59a40e4a9d719b6b0ae28af"

  - name: UV
