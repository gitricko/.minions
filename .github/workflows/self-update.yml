# self-update.yml — scheduled dependency self-update (skeleton).
# Wakes on cron, checks upstreams, bumps + opens a batch PR, merges when green,
# and fixes red PRs by booting minion from stable main in the runner.
#
# This is the DRAFT shape. Merge/check/fix helpers land here incrementally.

name: Self-Update

on:
  schedule:
    - cron: "0 3 * * 1"          # 03:00 UTC every Monday (tune cadence)
  workflow_dispatch: {}          # manual kick for testing

permissions:
  contents: write                # merge + push
  pull-requests: write           # open/update/close PRs
  checks: read                   # poll check status

env:
  MINIONS_HOME: "${{ runner.home }}/.minions"

concurrency:
  group: self-update
  cancel-in-progress: true

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect outdated dependencies
        id: check
        run: |
          scripts/check-updates.sh --json > /tmp/check.json
          cat /tmp/check.json
