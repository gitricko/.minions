# self-update.yml — scheduled dependency self-update (completed).
# Wakes on cron, checks upstreams, bumps + opens a batch PR,
# merges when green, and fixes red PRs by booting minion from
# stable main in the runner.
#
# Decisions implemented:
#   D3  — one batch PR per run, one commit per dep.
#   D4  — skip if an update PR is already open.
#   D5  — bump MINIONS_VERSION on green merge.
#   D7  — merge via own script (gh pr merge), not GitHub auto-merge.
#   D9  — fix loop ≤3 attempts, then leave PR open + label needs-review.
#   D10 — fix-agent LLM from booting minion from stable main.
#
# Guardrails:
#   - Agent never touches .github/workflows/ (D2).
#   - Main is protected; merge only when mergeable_state is "clean".

name: Self-Update Dependencies

on:
  schedule:
    - cron: "0 3 * * 1"          # 03:00 UTC every Monday (tune cadence)
  workflow_dispatch: {}          # manual kick for testing

permissions:
  contents: write                # merge + push
  pull-requests: write           # open/update/close PRs
  checks: read                   # poll check status

env:
  MINIONS_HOME: "/home/runner/.minions"
  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

concurrency:
  group: self-update
  cancel-in-progress: true

jobs:
  # ── check ────────────────────────────────────────────────
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Authenticate gh CLI
        run: |
      - name: Detect outdated dependencies
        id: detect
        run: |
          set -e
          scripts/check-updates.sh --json > /tmp/check.json
          OUT=$(python3 -c "import sys,json; d=json.load(open(sys.argv[1])); o=[r for r in d['outdated'] if r['outdated']]; print('NO_UPDATES') if not o else (print('updates:'+','.join(r['name'] for r in o)), [print('  {}: {} -> {}'.format(r['name'], r['version'], r['latest'])) for r in o])" /tmp/check.json)
          echo "$OUT"
          # Extract the updates line for the step output
          UPDATES_LINE=$(echo "$OUT" | grep '^updates:' || true)
          if [ -z "$UPDATES_LINE" ]; then
            echo "NO_UPDATES_FOUND=true" >> "$GITHUB_OUTPUT"
          else
            echo "NO_UPDATES_FOUND=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No updates → exit early
        if: steps.detect.outputs.NO_UPDATES_FOUND == 'true'
        run: |
          echo "No outdated dependencies found. Nothing to do."

      - name: Skip if an update PR already exists (D4)
        id: existing_pr
        run: |
          PR_JSON=$(gh pr list --state open --search "self-update in:title" --json number --limit 1 2>/dev/null || echo "[]")
          COUNT=$(echo "$PR_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))")
          if [ "$COUNT" -gt 0 ]; then
            echo "An update PR is already open. Skipping."
            echo "existing_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing update PR. Proceeding."
            echo "existing_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create batch bump PR (D3)
        if: steps.existing_pr.outputs.existing_pr == 'false'
        run: |
          set -e
          DEPS=$(python3 -c "import sys,json; d=json.load(open(sys.argv[1])); o=[r for r in d['outdated'] if r['outdated']]; print(' '.join('{}={}'.format(r['name'], r['latest']) for r in o))" /tmp/check.json)
          if [ -z "$DEPS" ]; then
            echo "No deps to bump."
            exit 0
          fi
          echo "Bumping: $DEPS"
          bash scripts/bump.sh --open-pr $DEPS

  # ── merge-or-fix ─────────────────────────────────────────
  merge-or-fix:
    name: Merge green / fix red PRs
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.result == 'success'

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Authenticate gh CLI
        run: |
          gh config set prompt disabled

      - name: Find the open update PR
        id: find_pr
        run: |
          PR_JSON=$(gh pr list --state open --search "self-update in:title" --json number --limit 1 2>/dev/null || echo "[]")
          PR_NUM=$(echo "$PR_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['number'] if d else 0)" 2>/dev/null || echo "0")
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          if [ "$PR_NUM" = "0" ]; then
            echo "No open update PR found."
            exit 0
          fi
          echo "Found update PR #${PR_NUM}"

      - name: Check mergeability (D7, D9)
        id: merge_check
        run: |
          PR_NUM="${{ steps.find_pr.outputs.pr_number }}"
          MERGEABLE=$(gh api repos/gitricko/.minions/pulls/"$PR_NUM" --jq '.mergeable_state' 2>/dev/null || echo "unknown")
          echo "mergeable_state=$MERGEABLE" >> "$GITHUB_OUTPUT"

      - name: Merge green PR (D7, D5)
        if: steps.merge_check.outputs.mergeable_state == 'clean'
        run: |
          PR_NUM="${{ steps.find_pr.outputs.pr_number }}"
          echo "Merging green PR #${PR_NUM}..."
          gh pr merge "$PR_NUM" --merge
          bash scripts/bump.sh --open-pr MINIONS=1.0.1 || true

      - name: Fix red PR (D9, D10)
        if: steps.merge_check.outputs.mergeable_state != 'clean'
        id: fix
        run: |
          PR_NUM="${{ steps.find_pr.outputs.pr_number }}"
          ATTEMPT=0
          while [ "$ATTEMPT" -lt 3 ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Fix attempt $ATTEMPT/3 for PR #${PR_NUM}..."
            if bash scripts/self-update-fix.sh "$PR_NUM" "unknown" "unknown" "unknown"; then
              echo "Fix succeeded."
              break
            fi
            echo "Fix attempt $ATTEMPT failed."
            sleep 10
          done
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "Fix attempts exhausted. Leaving PR open, labeling for human."
            gh pr edit "$PR_NUM" --add-label "self-update: needs-review"
          fi
