name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run install tests
        run: |
          set -e
          bash tests/test_install.sh

      - name: Run boot tests
        run: |
          set -e
          bash tests/test_boot.sh

      - name: Run real boot test
        env:
          CI_REAL_INSTALL: 1
        run: |
          set -e
          echo "=== Running real boot test ==="
          # Fresh install for boot test
          REAL_HOME=$(mktemp -d)
          export MINIONS_HOME="${REAL_HOME}"
          export PATH="${REAL_HOME}/bin:${PATH}"
          bash install.sh --minions-home "${REAL_HOME}" >/tmp/boot-install.log 2>&1
          echo "Install complete"
          # Run boot to COMPLETION in the foreground (services are setsid'd, so
          # boot.sh returns after the stack is UP). A hang here — e.g. an
          # interactive preconfig prompt blocking on TTY — trips the timeout
          # and FAILS the build. Previously we only checked ports then killed
          # boot, so post-port hangs (like the hermes mcp add prompt) were never
          # caught.
          timeout 180s bash boot.sh >/tmp/boot-run.log 2>&1
          BOOT_EXIT=$?
          echo "boot.sh exit code: ${BOOT_EXIT}"
          # boot.sh must reach the READY marker (i.e. preconfig completed, no hang)
          if ! grep -q "READY FOR FIRSTMATE DISPATCH\|stack is UP" /tmp/boot-run.log; then
            echo "FAIL: boot.sh did not reach completion marker"
            cat /tmp/boot-run.log
            exit 1
          fi
          # Services must be listening (no nc dependency — bash /dev/tcp)
          check_port() { bash -c "exec 3<>/dev/tcp/127.0.0.1/$1" 2>/dev/null; }
          for port in 20128 7352; do
            if check_port $port; then
              echo "Service on port $port is up"
            else
              echo "Service on port $port failed to start"
              exit 1
            fi
          done
          echo "Real boot test passed"
  real-install:
    name: Real Install (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Install uv (for Hermes)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Rust/cargo (for Mnemon)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run real install test + CLI integration test
        env:
          CI_REAL_INSTALL: 1
        run: |
          set -e
          # First run the real install test (but don't cleanup)
          REAL_HOME=$(mktemp -d)
          export MINIONS_HOME="${REAL_HOME}"
          echo "Running real install..."
          bash install.sh --minions-home "${REAL_HOME}"
          echo "Install complete"

          # Verify binaries
          for bin in omniroute modelrelay pi hermes; do
              if [ -x "${REAL_HOME}/bin/${bin}" ]; then
                  if timeout 10s "${REAL_HOME}/bin/${bin}" --version >/dev/null 2>&1; then
                      echo "✓ ${bin} installed and --version works"
                  else
                      echo "WARN: ${bin} installed but --version failed"
                  fi
              else
                  echo "FAIL: ${bin} not found"
                  exit 1
              fi
          done
          if [ -x "${REAL_HOME}/bin/mnemon" ]; then
              echo "✓ mnemon installed"
          else
              echo "FAIL: mnemon not found"
              exit 1
          fi

          # Now boot the stack
          export PATH="${REAL_HOME}/bin:${PATH}"
          timeout 180s bash "${REAL_HOME}/boot.sh" >/tmp/boot.log 2>&1
          BOOT_EXIT=$?
          echo "boot.sh exit code: ${BOOT_EXIT}"
          if ! grep -q "READY FOR FIRSTMATE DISPATCH\|stack is UP" /tmp/boot.log; then
              echo "FAIL: boot.sh did not reach completion marker"
              cat /tmp/boot.log
              exit 1
          fi
          echo "Stack booted successfully"

          # Now run CLI integration test using the same MINIONS_HOME
          export PATH="${REAL_HOME}/bin:${PATH}"
          bash tests/test_cli_integration.sh
