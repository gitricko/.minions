name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run install tests
        run: |
          set -e
          bash tests/test_install.sh

      - name: Run boot tests
        run: |
          set -e
          bash tests/test_boot.sh

  dts-integration:
    name: DTS Integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run full-stack DTS integration test
        run: |
          set -e
          bash tests/test_dts.sh

  real-install:
    name: Real Install (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Install uv (for Hermes)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Rust/cargo (for Mnemon)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run real install test + CLI integration test
        env:
          CI_REAL_INSTALL: 1
        run: |
          set -e
          # Install to fixed location ~/.minions (multi-instance support removed)
          echo "Running real install..."
          bash install.sh
          echo "Install complete"

          # Verify binaries
          for bin in omniroute modelrelay pi hermes; do
              if [ -x "${HOME}/.minions/bin/${bin}" ]; then
                  if timeout 10s "${HOME}/.minions/bin/${bin}" --version >/dev/null 2>&1; then
                      echo "✓ ${bin} installed and --version works"
                  else
                      echo "WARN: ${bin} installed but --version failed"
                  fi
              else
                  echo "FAIL: ${bin} not found"
                  exit 1
              fi
          done
          if [ -x "${HOME}/.minions/bin/mnemon" ]; then
              echo "✓ mnemon installed"
          else
              echo "FAIL: mnemon not found"
              exit 1
          fi

          # Verify Hermes reads the standard ~/.hermes/config.yaml (not a fake HOME)
          if grep -q "base_url: http://127.0.0.1:20128/v1" "${HOME}/.hermes/config.yaml"; then
              echo "✓ hermes config at ~/.hermes/config.yaml"
          else
              echo "FAIL: ~/.hermes/config.yaml missing expected ports"
              exit 1
          fi

          # Now boot the stack
          export PATH="${HOME}/.minions/bin:${PATH}"
          timeout 300s bash "${HOME}/.minions/boot.sh" >/tmp/boot.log 2>&1
          BOOT_EXIT=$?
          echo "boot.sh exit code: ${BOOT_EXIT}"
          if ! grep -q "READY FOR FIRSTMATE DISPATCH\|stack is UP" /tmp/boot.log; then
              echo "FAIL: boot.sh did not reach completion marker"
              cat /tmp/boot.log
              exit 1
          fi
          echo "Stack booted successfully"

          # Now run CLI integration test using the same HOME
          export PATH="${HOME}/.minions/bin:${PATH}"
          bash tests/test_cli_integration.sh
