name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run install tests
        run: |
          set -e
          bash tests/test_install.sh

      - name: Run boot tests
        run: |
          set -e
          bash tests/test_boot.sh

      - name: Run real boot test
        env:
          CI_REAL_INSTALL: 1
        run: |
          set -e
          echo "=== Running real boot test ==="
          # First run real install
          bash tests/test_install.sh
          # Get the install dir (test_install.sh creates a temp dir and cleans it up)
          # We need to re-run install to have the binaries available
          REAL_HOME=$(mktemp -d)
          export MINIONS_HOME="${REAL_HOME}"
          export PATH="${REAL_HOME}/bin:${PATH}"
          # Install fresh for boot test
          bash install.sh --minions-home "${REAL_HOME}"
          # Start boot.sh in background
          timeout 60s bash boot.sh &
          BOOT_PID=$!
          sleep 10
          # Check if services are running (no nc dependency — use bash /dev/tcp)
          check_port() { bash -c "exec 3<>/dev/tcp/127.0.0.1/$1" 2>/dev/null; }
          for port in 20128 7352; do
            if check_port $port; then
              echo "Service on port $port is up"
            else
              echo "Service on port $port failed to start"
              kill $BOOT_PID 2>/dev/null || true
              exit 1
            fi
          done
          # Clean up
          kill $BOOT_PID 2>/dev/null || true
          echo "Real boot test passed"
  real-install:
    name: Real Install (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Install uv (for Hermes)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Rust/cargo (for Mnemon)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run real install test
        env:
          CI_REAL_INSTALL: 1
        run: |
          set -e
          bash tests/test_install.sh
