name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run install tests
        run: |
          set -e
          bash tests/test_install.sh

      - name: Run boot tests
        run: |
          set -e
          bash tests/test_boot.sh

      - name: Run pi wrapper CWD tests
        run: |
          set -e
          bash tests/test_pi_wrapper_cwd.sh

      - name: Run skill YAML validation
        run: |
          set -e
          bash tests/test_skill_yaml.sh

      - name: Run self-update tests
        run: |
          set -e
          bash tests/test_self_update.sh

      - name: Knowledge layer global checks (F1 shell syntax, F3 JSON, F5 no .devcontainer refs)
        run: |
          # These validate file integrity without needing services/install.
          # self-check.sh --ci returns exit 1 for warnings (no mnemon, no config,
          # no knowledge in unit test context) — that belongs in real-install/DTS
          # where the stack actually runs, not here.
          set -e
          bash scripts/verify-knowledge.sh F1
          bash scripts/verify-knowledge.sh F3
          bash scripts/verify-knowledge.sh F5
          # Phase 22: two-mode detection unit tests (dev + standalone + env override)
          bash tests/test_knowledge_mode.sh
          # Phase 22.5: bootstrap unit tests (piped detection, tarball standalone, git dev)
          bash tests/test_bootstrap.sh

  dts-integration:
    name: DTS Integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run full-stack DTS integration test (up to 3 retries)
        run: |
          set -e
          for i in 1 2 3; do
            if bash tests/test_dts.sh; then
              echo "DTS passed on attempt $i"
              exit 0
            fi
            echo "DTS attempt $i failed, retrying..."
          done
          echo "DTS failed after 3 attempts"
          exit 1

  real-install:
    name: Real Install (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install uv (for Hermes)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Rust/cargo (for Mnemon)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run real install test + CLI integration test
        env:
          CI_REAL_INSTALL: 1
        run: |
          set -e
          # Install to fixed location ~/.minions (multi-instance support removed)
          echo "Running real install..."
          bash install.sh
          echo "Install complete"

          # Verify binaries. Hard-fail: a component installed but unusable is a real
          # defect, not a warning. NOTE: 9router does NOT support --version (no such
          # flag upstream; it would start the server and hang), so it is verified by
          # booting + hitting its /v1/models endpoint in the CLI integration test below.
          for bin in omniroute pi hermes; do
              if [ -x "${HOME}/.minions/bin/${bin}" ]; then
                  if timeout 10s "${HOME}/.minions/bin/${bin}" --version >/dev/null 2>&1; then
                      echo "✓ ${bin} installed and --version works"
                  else
                      echo "FAIL: ${bin} installed but --version failed (broken wrapper/binary)"
                      exit 1
                  fi
              else
                  echo "FAIL: ${bin} not found"
                  exit 1
              fi
          done
          if [ -x "${HOME}/.minions/bin/9router" ]; then
              echo "✓ 9router binary present (no --version flag upstream; verified via /v1/models in CLI test)"
          else
              echo "FAIL: 9router not found"
              exit 1
          fi
          if [ -x "${HOME}/.minions/bin/mnemon" ]; then
              echo "✓ mnemon installed"
          else
              echo "FAIL: mnemon not found"
              exit 1
          fi

          # Verify Hermes reads the standard ~/.hermes/config.yaml (not a fake HOME)
          if grep -q "base_url: http://127.0.0.1:20128/v1" "${HOME}/.hermes/config.yaml"; then
              echo "✓ hermes config at ~/.hermes/config.yaml"
          else
              echo "FAIL: ~/.hermes/config.yaml missing expected ports"
              exit 1
          fi

          # Now boot the stack
          export PATH="${HOME}/.minions/bin:${PATH}"
          timeout 300s bash "${HOME}/.minions/boot.sh" >/tmp/boot.log 2>&1
          BOOT_EXIT=$?
          echo "boot.sh exit code: ${BOOT_EXIT}"
          if ! grep -q "READY FOR FIRSTMATE DISPATCH\|stack is UP" /tmp/boot.log; then
              echo "FAIL: boot.sh did not reach completion marker"
              cat /tmp/boot.log
              exit 1
          fi
          echo "Stack booted successfully"

          # Run full self-check with services running
          echo "Running self-check..."
          bash self-check.sh || {
            echo "WARNING: self-check reported issues (exit $?)"
            cat /tmp/health-report.json
          }

          # T7: real-install standalone test (Phase 22.5 proposal)
          # Fetch tarball, run install.sh with --no-* flags in temp HOME
          echo "Running standalone bootstrap test..."
          # Fetch from the PR branch (or main on push) — the bootstrap +
          # knowledge-detection code lives there. Using the branch ref ensures
          # the test runs against the code being validated.
          TARBALL_URL="https://github.com/gitricko/.minions/archive/refs/heads/${GITHUB_HEAD_REF:-main}.tar.gz"
          STANDALONE_HOME="${HOME}/.minions-standalone-test"
          BOOTSTRAP_DIR="/tmp/minions-bootstrap-test"
          rm -rf "${STANDALONE_HOME}" "${BOOTSTRAP_DIR}"
          mkdir -p "${STANDALONE_HOME}" "${BOOTSTRAP_DIR}"
          # Use curl to fetch install.sh from tarball and pipe to bash
          # We'll use a simple approach: download tarball, extract, run from there
          # Note: this tests the full bootstrap flow in real-install context
          if curl -fsSL "${TARBALL_URL}" | tar xz -C "${BOOTSTRAP_DIR}" 2>/dev/null; then
              EXTRACTED=$(find /tmp/minions-bootstrap-test -maxdepth 1 -type d -name '.minions*' | head -1)
              if [ -n "${EXTRACTED}" ] && [ -f "${EXTRACTED}/install.sh" ]; then
                  HOME="${STANDALONE_HOME}" bash "${EXTRACTED}/install.sh" --no-hermes --no-omniroute --no-9router 2>&1 | tee /tmp/standalone_real_install.log
                  if [ ${PIPESTATUS[0]} -eq 0 ]; then
                      echo "✓ Standalone real-install test exit 0"
                      if grep -q "Knowledge mode: standalone" /tmp/standalone_real_install.log; then
                          echo "✓ Standalone mode detected"
                      else
                          echo "FAIL: Standalone mode NOT detected"
                          cat /tmp/standalone_real_install.log
                          exit 1
                      fi
                      if [ -d "${STANDALONE_HOME}/.minions/skills" ] && [ -f "${STANDALONE_HOME}/.minions/etc/knowledge.env" ]; then
                          echo "✓ Standalone assets copied"
                      else
                          echo "FAIL: Standalone assets NOT copied"
                          ls -la "${STANDALONE_HOME}/.minions/" 2>/dev/null || echo "no .minions"
                          exit 1
                      fi
                  else
                      echo "FAIL: Standalone install exited non-zero"
                      cat /tmp/standalone_real_install.log
                      exit 1
                  fi
              else
                  echo "WARN: Could not find extracted install.sh, skipping standalone test"
              fi
          else
              echo "FAIL: Tarball fetch failed (T7 standalone test could not run)"
              exit 1
          fi
          rm -rf /tmp/minions-bootstrap-test

          # T7b: Piped INSTALL_URL auto-derivation test (new)
          # This tests the user-facing command: export INSTALL_URL=... && bash -c "$(curl ...)"
          echo "Running piped INSTALL_URL auto-derivation test..."
          # Use the branch name from the PR head ref or fallback
          BRANCH_NAME="${GITHUB_HEAD_REF:-main}"
          export INSTALL_URL="https://github.com/gitricko/.minions/raw/refs/heads/${BRANCH_NAME}/install.sh"
          STANDALONE_HOME2="${HOME}/.minions-standalone-test2"
          rm -rf "${STANDALONE_HOME2}"
          mkdir -p "${STANDALONE_HOME2}"
          # Simulate the exact user command pattern:
          #   export INSTALL_URL="..."
          #   HOME=/custom/home bash -c "$(curl -fsSL "$INSTALL_URL")"
          # INSTALL_URL exported in parent shell; HOME set for bash -c
          if HOME="${STANDALONE_HOME2}" bash -c "$(curl -fsSL "${INSTALL_URL}")" -- --no-hermes --no-omniroute --no-9router 2>&1 | tee /tmp/standalone_piped_test.log; then
              echo "✓ Piped INSTALL_URL test exit 0"
              if grep -q "Knowledge mode: standalone" /tmp/standalone_piped_test.log; then
                  echo "✓ Standalone mode detected"
              else
                  echo "FAIL: Standalone mode NOT detected"
                  cat /tmp/standalone_piped_test.log
                  exit 1
              fi
              if grep -q "derived BOOTSTRAP_URL from INSTALL_URL" /tmp/standalone_piped_test.log; then
                  echo "✓ BOOTSTRAP_URL auto-derivation worked"
              else
                  echo "FAIL: BOOTSTRAP_URL auto-derivation NOT triggered"
                  cat /tmp/standalone_piped_test.log
                  exit 1
              fi
              if [ -d "${STANDALONE_HOME2}/.minions/skills" ] && [ -f "${STANDALONE_HOME2}/.minions/etc/knowledge.env" ]; then
                  echo "✓ Standalone assets copied"
              else
                  echo "FAIL: Standalone assets NOT copied"
                  ls -la "${STANDALONE_HOME2}/.minions/" 2>/dev/null || echo "no .minions"
                  exit 1
              fi
              # Phase 24: standalone Pi settings.json must point at the standalone skills dir
              if [ -f "${STANDALONE_HOME2}/.pi/agent/settings.json" ] && \
                 grep -q '"skills"' "${STANDALONE_HOME2}/.pi/agent/settings.json" && \
                 grep -q "${STANDALONE_HOME2}/.minions/skills" "${STANDALONE_HOME2}/.pi/agent/settings.json"; then
                  echo "✓ Pi settings.json wired with standalone skills path"
              else
                  echo "FAIL: Pi settings.json missing standalone skills path"
                  cat "${STANDALONE_HOME2}/.pi/agent/settings.json" 2>/dev/null || echo "no settings.json"
                  exit 1
              fi
          else
              echo "FAIL: Piped INSTALL_URL test exited non-zero"
              cat /tmp/standalone_piped_test.log
              exit 1
          fi
          rm -rf "${STANDALONE_HOME2}"

          # Now run CLI integration test using the same HOME
          export PATH="${HOME}/.minions/bin:${PATH}"
          bash tests/test_cli_integration.sh