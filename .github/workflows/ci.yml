name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Detect what changed — gates whether we run full suite or just lint
  # ─────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      content: ${{ steps.filter.outputs.content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            infrastructure:
              - 'install.sh'
              - 'boot.sh'
              - 'stop.sh'
              - 'status.sh'
              - 'self-check.sh'
              - 'lib/**'
              - 'scripts/**'
              - 'tests/**'
              - 'etc/**'
              - '.github/workflows/**'
              - '.node-version'
            content:
              - 'skills/**'
              - 'wiki/**'
              - 'mnemon/**'
              - 'memories/**'

  # ── Run lint for content-only changes ──────────────────────────────
  lint:
    name: Lint (content changes)
    needs: detect-changes
    if: needs.detect-changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Skill YAML validation
        run: bash tests/test_skill_yaml.sh

      - name: Markdown lint (skills + wiki)
        run: bash skills/ci-lint-check/scripts/ci_lint_check.sh --markdown-only

      - name: Knowledge layer checks (F1 shell syntax, F3 JSON, F5 no refs)
        run: |
          bash scripts/verify-knowledge.sh F1
          bash scripts/verify-knowledge.sh F3
          bash scripts/verify-knowledge.sh F5

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run install tests
        run: |
          set -e
          bash tests/test_install.sh

      - name: Run boot tests
        run: |
          set -e
          bash tests/test_boot.sh

      - name: Run pi wrapper CWD tests
        run: |
          set -e
          bash tests/test_pi_wrapper_cwd.sh

      - name: Run skill YAML validation
        run: |
          set -e
          bash tests/test_skill_yaml.sh

      - name: Run self-update tests
        run: |
          set -e
          bash tests/test_self_update.sh

      - name: Run pi trust tests
        run: |
          set -e
          bash tests/test_pi_trust.sh

      - name: Run uninstall tests
        run: |
          set -e
          bash tests/test_uninstall.sh

      - name: Knowledge layer global checks (F1 shell syntax, F3 JSON, F5 no .devcontainer refs)
        run: |
          # These validate file integrity without needing services/install.
          # self-check.sh --ci returns exit 1 for warnings (no mnemon, no config,
          # no knowledge in unit test context) — that belongs in real-install/DTS
          # where the stack actually runs, not here.
          set -e
          bash scripts/verify-knowledge.sh F1
          bash scripts/verify-knowledge.sh F3
          bash scripts/verify-knowledge.sh F5
          # Phase 22: two-mode detection unit tests (dev + standalone + env override)
          bash tests/test_knowledge_mode.sh
          # Phase 22.5: bootstrap unit tests (piped detection, tarball standalone, git dev)
          bash tests/test_bootstrap.sh

  # ─────────────────────────────────────────────────────────────────
  # Blocking: deps.yaml is the single source of truth. versions.env,
  # .node-version (what setup-node reads) and the README version pills are
  # all generated from it. Drift means a hand-edit landed where it should
  # not have.
  #
  # Standalone (no detect-changes gate) on purpose: a PR touching only
  # README.md must still be checked, or the badge can drift undetected --
  # the exact failure from gitricko/pi-failover#8. Both checks are offline
  # and take about a second, so there is nothing to gate.
  # ─────────────────────────────────────────────────────────────────
  version-sync:
    name: Version sync (deps.yaml → versions.env + .node-version + README)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pyyaml
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Check versions.env, .node-version and README badges match deps.yaml
        run: |
          set -e
          bash scripts/sync-versions.sh --check
          bash scripts/sync-readme-badges.sh --check

  # ─────────────────────────────────────────────────────────────────
  # Advisory: how far behind upstream are our pins? Never blocks a PR.
  # Pattern borrowed from gitricko/pi-failover#8, where CI, code and the
  # README badge each pinned a different host version and CI stayed green.
  # ─────────────────────────────────────────────────────────────────
  dependency-drift:
    name: Dependency drift (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pyyaml
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Report outdated dependencies
        # check-updates.sh is read-only: it queries GitHub/npm and reports, it
        # never writes and never opens a PR. Writes happen only via
        # self-update.yml on its weekly cron.
        #
        # Renders the table AND sets the exit code in one pass — reporting and
        # gating come from the same computation, so they cannot disagree.
        run: |
          set -e
          scripts/check-updates.sh --json > /tmp/check.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/check.json'))
          rows = d['outdated']
          width = max(len(r['name']) for r in rows)
          print(f'{"DEP".ljust(width)}  {"PINNED".ljust(16)}  {"LATEST".ljust(16)}  STATE')
          for r in rows:
              if r['latest'] is None:
                  state = 'UNKNOWN (upstream query failed)'
              else:
                  state = 'OUTDATED' if r['outdated'] else 'current'
              print(f'{r["name"].ljust(width)}  {str(r["version"]).ljust(16)}  {str(r["latest"]).ljust(16)}  {state}')
          stale = [r for r in rows if r['outdated']]
          if stale:
              print(f'\n{len(stale)} dependency/dependencies have upstream updates:')
              for r in stale:
                  print(f'  {r["name"]}: {r["version"]} -> {r["latest"]}')
              print('\nThis job is advisory. To apply them: scripts/admin-update.sh')
              sys.exit(1)
          print('\nAll dependencies are current.')
          PY

  dts-integration:
    name: DTS Integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.infrastructure == 'true'
    env:
      CI_LOGS_DIR: /tmp/dts-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Ollama version from deps.yaml
        id: ollama_version
        run: |
          version=$(sed -n '/name: OLLAMA/{n;s/.*version: *"\(.*\)".*/\1/p;}' etc/deps.yaml | head -1)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Cache Ollama binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/minions-dts/ollama-${{ steps.ollama_version.outputs.version }}-linux-${{ runner.arch }}
          key: ollama-${{ steps.ollama_version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            ollama-${{ steps.ollama_version.outputs.version }}-${{ runner.os }}-

      - name: Run full-stack DTS integration test (up to 3 retries)
        run: |
          set -e
          mkdir -p "${CI_LOGS_DIR}"
          for i in 1 2 3; do
            if LOGS_DIR="${CI_LOGS_DIR}" bash tests/test_dts.sh; then
              echo "DTS passed on attempt $i"
              exit 0
            fi
            echo "DTS attempt $i failed, retrying..."
          done
          echo "DTS failed after 3 attempts"
          exit 1

      # ── Collect diagnostic logs (uploaded every run; if-no-files-found: warn) ──
      - name: Collect diagnostic logs (DTS)
        if: always()
        run: |
          # Logs written inside the container land on host via bind-mount
          # (dts.sh mounts $LOGS_DIR -> /tmp/ci). Container logs live under
          # ~/.minions/var/log inside the container; they are copied out here.
          echo "=== Collected DTS logs (host /tmp/dts-logs) ==="
          ls -la "${CI_LOGS_DIR}/" 2>/dev/null || true

      - name: Upload DTS diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dts-ci-logs-${{ github.run_id }}
          path: ${{ env.CI_LOGS_DIR }}/
          if-no-files-found: warn
          retention-days: 7

  real-install:
    name: Real Install (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    env:
      CI_LOGS_DIR: /tmp/real-install
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install uv (for Hermes)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Rust/cargo (for Mnemon)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run real install test + CLI integration test
        env:
          CI_REAL_INSTALL: 1
        run: |
          set -e
          mkdir -p "${CI_LOGS_DIR}"
          # Install to fixed location ~/.minions (multi-instance support removed)
          echo "Running real install..."
          bash install.sh
          echo "Install complete"

          # Verify binaries. Hard-fail: a component installed but unusable is a real
          # defect, not a warning. 9router supports --version as of 0.5.81.
          for bin in omniroute pi hermes 9router; do
              if [ -x "${HOME}/.minions/bin/${bin}" ]; then
                  if timeout 10s "${HOME}/.minions/bin/${bin}" --version >/dev/null 2>&1; then
                      echo "✓ ${bin} installed and --version works"
                  else
                      echo "FAIL: ${bin} installed but --version failed (broken wrapper/binary)"
                      exit 1
                  fi
              else
                  echo "FAIL: ${bin} not found"
                  exit 1
              fi
          done
          if [ -x "${HOME}/.minions/bin/mnemon" ]; then
              echo "✓ mnemon installed"
          else
              echo "FAIL: mnemon not found"
              exit 1
          fi

          # Verify Hermes reads the standard ~/.hermes/config.yaml (not a fake HOME)
          if grep -q "base_url: http://127.0.0.1:20128/v1" "${HOME}/.hermes/config.yaml"; then
              echo "✓ hermes config at ~/.hermes/config.yaml"
          else
              echo "FAIL: ~/.hermes/config.yaml missing expected ports"
              exit 1
          fi

          # Now boot the stack
          export PATH="${HOME}/.minions/bin:${PATH}"
          timeout 300s bash "${HOME}/.minions/boot.sh" >"${CI_LOGS_DIR}/boot.log" 2>&1
          BOOT_EXIT=$?
          echo "boot.sh exit code: ${BOOT_EXIT}"
          if ! grep -q "READY FOR FIRSTMATE DISPATCH\|stack is UP" "${CI_LOGS_DIR}/boot.log"; then
              echo "FAIL: boot.sh did not reach completion marker"
              cat "${CI_LOGS_DIR}/boot.log"
              exit 1
          fi
          echo "Stack booted successfully"

          # Run full self-check with services running
          echo "Running self-check..."
          bash self-check.sh || {
              echo "WARNING: self-check reported issues (exit $?)" 
              cat "${CI_LOGS_DIR}/health-report.json"
          }

          # T7: real-install standalone test (Phase 22.5 proposal)
          # Fetch tarball, run install.sh with --no-* flags in temp HOME
          echo "Running standalone bootstrap test..."
          # Fetch from the PR branch (or main on push) — the bootstrap +
          # knowledge-detection code lives there. Using the branch ref ensures
          # the test runs against the code being validated.
          TARBALL_URL="https://github.com/gitricko/.minions/archive/refs/heads/${GITHUB_HEAD_REF:-main}.tar.gz"
          STANDALONE_HOME="${HOME}/.minions-standalone-test"
          BOOTSTRAP_DIR="/tmp/minions-bootstrap-test"
          rm -rf "${STANDALONE_HOME}" "${BOOTSTRAP_DIR}"
          mkdir -p "${STANDALONE_HOME}" "${BOOTSTRAP_DIR}"
          # Use curl to fetch install.sh from tarball and pipe to bash
          # We'll use a simple approach: download tarball, extract, run from there
          # Note: this tests the full bootstrap flow in real-install context
          if curl -fsSL "${TARBALL_URL}" | tar xz -C "${BOOTSTRAP_DIR}" 2>/dev/null; then
              EXTRACTED=$(find /tmp/minions-bootstrap-test -maxdepth 1 -type d -name '.minions*' | head -1)
              if [ -n "${EXTRACTED}" ] && [ -f "${EXTRACTED}/install.sh" ]; then
                  HOME="${STANDALONE_HOME}" bash "${EXTRACTED}/install.sh" --no-hermes --no-omniroute --no-9router 2>&1 | tee "${CI_LOGS_DIR}/standalone_real_install.log"
                  if [ ${PIPESTATUS[0]} -eq 0 ]; then
                      echo "✓ Standalone real-install test exit 0"
                      if grep -q "Knowledge mode: standalone" "${CI_LOGS_DIR}/standalone_real_install.log"; then
                          echo "✓ Standalone mode detected"
                      else
                          echo "FAIL: Standalone mode NOT detected"
                          cat "${CI_LOGS_DIR}/standalone_real_install.log"
                          exit 1
                      fi
                      if [ -d "${STANDALONE_HOME}/.minions/skills" ] && [ -f "${STANDALONE_HOME}/.minions/etc/knowledge.env" ]; then
                          echo "✓ Standalone assets copied"
                      else
                          echo "FAIL: Standalone assets NOT copied"
                          ls -la "${STANDALONE_HOME}/.minions/" 2>/dev/null || echo "no .minions"
                          exit 1
                      fi
                  else
                      echo "FAIL: Standalone install exited non-zero"
                      cat "${CI_LOGS_DIR}/standalone_real_install.log"
                      exit 1
                  fi
              else
                  echo "WARN: Could not find extracted install.sh, skipping standalone test"
              fi
          else
              echo "FAIL: Tarball fetch failed (T7 standalone test could not run)"
              exit 1
          fi
          rm -rf /tmp/minions-bootstrap-test

          # T7b: Piped INSTALL_URL auto-derivation test (new)
          # This tests the user-facing command: export INSTALL_URL=... && bash -c "$(curl ...)"
          echo "Running piped INSTALL_URL auto-derivation test..."
          # Use the branch name from the PR head ref or fallback
          BRANCH_NAME="${GITHUB_HEAD_REF:-main}"
          export INSTALL_URL="https://github.com/gitricko/.minions/raw/refs/heads/${BRANCH_NAME}/install.sh"
          STANDALONE_HOME2="${HOME}/.minions-standalone-test2"
          rm -rf "${STANDALONE_HOME2}"
          mkdir -p "${STANDALONE_HOME2}"
          # Simulate the exact user command pattern:
          #   export INSTALL_URL="..."
          #   HOME=/custom/home bash -c "$(curl -fsSL "$INSTALL_URL")"
          # INSTALL_URL exported in parent shell; HOME set for bash -c
          if HOME="${STANDALONE_HOME2}" bash -c "$(curl -fsSL "${INSTALL_URL}")" -- --no-hermes --no-omniroute --no-9router 2>&1 | tee "${CI_LOGS_DIR}/standalone_piped_test.log"; then
              echo "✓ Piped INSTALL_URL test exit 0"
              if grep -q "Knowledge mode: standalone" "${CI_LOGS_DIR}/standalone_piped_test.log"; then
                  echo "✓ Standalone mode detected"
              else
                  echo "FAIL: Standalone mode NOT detected"
                  cat "${CI_LOGS_DIR}/standalone_piped_test.log"
                  exit 1
              fi
              if grep -q "derived BOOTSTRAP_URL from INSTALL_URL" "${CI_LOGS_DIR}/standalone_piped_test.log"; then
                  echo "✓ BOOTSTRAP_URL auto-derivation worked"
              else
                  echo "FAIL: BOOTSTRAP_URL auto-derivation NOT triggered"
                  cat "${CI_LOGS_DIR}/standalone_piped_test.log"
                  exit 1
              fi
              if [ -d "${STANDALONE_HOME2}/.minions/skills" ] && [ -f "${STANDALONE_HOME2}/.minions/etc/knowledge.env" ]; then
                  echo "✓ Standalone assets copied"
              else
                  echo "FAIL: Standalone assets NOT copied"
                  ls -la "${STANDALONE_HOME2}/.minions/" 2>/dev/null || echo "no .minions"
                  exit 1
              fi
              # Phase 24: standalone Pi settings.json must point at the standalone skills dir
              if [ -f "${STANDALONE_HOME2}/.pi/agent/settings.json" ] && \
                 grep -q '"skills"' "${STANDALONE_HOME2}/.pi/agent/settings.json" && \
                 grep -q "${STANDALONE_HOME2}/.minions/skills" "${STANDALONE_HOME2}/.pi/agent/settings.json"; then
                  echo "✓ Pi settings.json wired with standalone skills path"
              else
                  echo "FAIL: Pi settings.json missing standalone skills path"
                  cat "${STANDALONE_HOME2}/.pi/agent/settings.json" 2>/dev/null || echo "no settings.json"
                  exit 1
              fi
          else
              echo "FAIL: Piped INSTALL_URL test exited non-zero"
              cat "${CI_LOGS_DIR}/standalone_piped_test.log"
              exit 1
          fi
          rm -rf "${STANDALONE_HOME2}"

          # Now run CLI integration test using the same HOME
          export PATH="${HOME}/.minions/bin:${PATH}"
          bash tests/test_cli_integration.sh

          # Test uninstall.sh default purge (verify CLEAN)
          echo "=== Real Install: uninstall.sh default purge ==="
          bash uninstall.sh --force --verify 2>&1 | tee "${CI_LOGS_DIR}/uninstall_purge.log"
          if grep -q '^CLEAN$' "${CI_LOGS_DIR}/uninstall_purge.log"; then
              echo "✓ Real Install: uninstall.sh verify CLEAN"
          else
              echo "FAIL: Real Install uninstall verify not CLEAN"
              cat "${CI_LOGS_DIR}/uninstall_purge.log"
              exit 1
          fi
          # Verify entire folders gone
          for d in .minions .hermes .pi .omniroute .9router .mnemon .ollama; do
              if [ ! -e "${HOME}/${d}" ]; then
                  echo "✓ Real Install: uninstall.sh removed ~/${d} (default purge)"
              else
                  echo "FAIL: Real Install uninstall left ~/${d}"
                  exit 1
              fi
          done

          # Reinstall after uninstall (clean cycle)
          echo "=== Real Install: reinstall after uninstall ==="
          bash install.sh --no-hermes --no-omniroute --no-9router 2>&1 | tee "${CI_LOGS_DIR}/reinstall.log"
          if [ -d "${HOME}/.minions" ] && [ -f "${HOME}/.minions/bin/pi" ]; then
              echo "✓ Real Install: reinstall restored ~/.minions with binaries"
          else
              echo "FAIL: Real Install reinstall missing ~/.minions or binaries"
              exit 1
          fi

          # uninstall.sh --keep-config (preserves dot folders)
          echo "=== Real Install: uninstall.sh --keep-config ==="
          bash uninstall.sh --keep-config --force --verify 2>&1 | tee "${CI_LOGS_DIR}/uninstall_keep.log"
          if grep -q '^CLEAN$' "${CI_LOGS_DIR}/uninstall_keep.log"; then
              echo "✓ Real Install: uninstall.sh --keep-config verify CLEAN"
          else
              echo "FAIL: Real Install uninstall --keep-config verify not CLEAN"
              cat "${CI_LOGS_DIR}/uninstall_keep.log"
              exit 1
          fi
          if [ ! -e "${HOME}/.minions" ]; then
              echo "✓ Real Install: uninstall.sh --keep-config removed ~/.minions"
          else
              echo "FAIL: Real Install uninstall --keep-config left ~/.minions"
              exit 1
          fi
          for d in .hermes .pi .omniroute .9router .mnemon .ollama; do
              if [ -e "${HOME}/${d}" ]; then
                  echo "✓ Real Install: uninstall.sh --keep-config preserved ~/${d}"
              else
                  echo "FAIL: Real Install uninstall --keep-config removed ~/${d} (should preserve)"
                  exit 1
              fi
          done

      # ── Collect diagnostic logs (uploaded every run; if-no-files-found: warn) ──
      - name: Collect diagnostic logs (Real Install)
        if: always()
        run: |
          # Boot/service logs (written by boot.sh to ~/.minions/var/log)
          cp "${HOME}/.minions/var/log/boot.log"      "${CI_LOGS_DIR}/" 2>/dev/null || true
          cp "${HOME}/.minions/var/log/omniroute.log" "${CI_LOGS_DIR}/" 2>/dev/null || true
          cp "${HOME}/.minions/var/log/9router.log"   "${CI_LOGS_DIR}/" 2>/dev/null || true

          # System diagnostics
          ps aux > "${CI_LOGS_DIR}/ps-aux.txt" 2>&1 || true
          ss -tlnp > "${CI_LOGS_DIR}/ss-tlnp.txt" 2>&1 || netstat -tlnp > "${CI_LOGS_DIR}/netstat-tlnp.txt" 2>&1 || true

          echo "=== Collected logs ==="
          ls -la "${CI_LOGS_DIR}/"

      - name: Upload Real Install diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-install-ci-logs-${{ github.run_id }}
          path: ${{ env.CI_LOGS_DIR }}/
          if-no-files-found: warn
          retention-days: 7